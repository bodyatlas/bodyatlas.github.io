name: Clausery CI

on:
  push:
    branches: [main]
    paths: ['clausery/**', 'robots.txt', '404.html', '.github/workflows/clausery.yml']
  pull_request:
    paths: ['clausery/**', 'robots.txt', '404.html', '.github/workflows/clausery.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clausery-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clausery

jobs:
  verify:
    name: Lint, unit tests, static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clausery/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:html
      - name: Generated files are up to date
        run: |
          npm run build
          git add -A -N .. >/dev/null
          if ! git diff --quiet -- . ../robots.txt ../404.html; then
            git status --short -- . ../robots.txt ../404.html
            echo "Generated files are stale or missing. Run npm run build and commit the result."
            exit 1
          fi

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clausery/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: clausery/playwright-report
          retention-days: 7

  indexnow:
    name: Notify search engines (IndexNow)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for GitHub Pages to publish this commit
        run: |
          key=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1)
          for i in $(seq 1 30); do
            if curl -fsS "https://bodyatlas.github.io/clausery/$key" -o /dev/null; then echo "key file is live"; exit 0; fi
            sleep 10
          done
          echo "key file not live yet; submitting anyway (IndexNow verifies it later)"
      - run: npm run indexnow
